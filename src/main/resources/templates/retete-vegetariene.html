<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Retete vegetariene</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<div class="content">
    <h1 th:text="${titlu}">Titlu</h1>
    <p class="subtitle">Cerinta 7.03 a)</p>

    <p th:if="${#lists.isEmpty(retete)}" class="empty">Nu exista retete vegetariene in baza de date.</p>

    <table th:unless="${#lists.isEmpty(retete)}">
        <tr>
            <th>Reteta</th>
            <th class="num">Timp (min)</th>
            <th class="num">Portii</th>
            <th>Autor</th>
            <th>Categorie</th>
        </tr>
        <tr th:each="r : ${retete}">
            <td th:text="${r.nume}">Nume</td>
            <td class="num" th:text="${r.timpPreparare}">0</td>
            <td class="num" th:text="${r.portii}">0</td>
            <td th:text="${r.autor}">Autor</td>
            <td th:text="${r.categorie.tip}">Categorie</td>
        </tr>
    </table>

    <a th:replace="~{fragments :: back}"></a>
</div>
</body>
</html>
